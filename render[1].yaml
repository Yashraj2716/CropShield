services:
  - type: web
    name: cropshield-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPEN_METEO_API_URL
        value: https://api.open-meteo.com/v1/forecast
